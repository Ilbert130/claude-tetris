<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar tema claro/oscuro" />
        <span class="theme-switch-track">
          <span class="theme-switch-thumb"></span>
        </span>
      </label>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value" id="powerup-indicator">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hs-section">
          <span class="label">RÉCORDS</span>
          <ol class="hs-list" id="hs-panel-list"></ol>
          <div class="hs-meta">
            <span>Mejor combo: <strong id="hs-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="hs-max-lines">0</strong></span>
          </div>
          <button id="hs-reset-btn" class="hs-reset-btn" type="button">Resetear récords</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="hs-overlay-section" class="hs-overlay-section hidden">
            <div id="hs-entry-form" class="hs-entry-form hidden">
              <input id="hs-name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
              <button id="hs-submit-btn" type="button">Guardar</button>
            </div>
            <ol class="hs-list" id="hs-overlay-list"></ol>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
